<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sahiya Admin Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --sidebar:#1A1533;
  --sidebar-hi:#2A2354;
  --sidebar-text:#B4AFD1;
  --bg:#F5F4FA;
  --surface:#FFFFFF;
  --ink:#211C3D;
  --ink-soft:#6B6790;
  --ink-faint:#9C97BC;
  --pink:#EC4899;
  --pink-dark:#D4247A;
  --pink-soft:#FCE7F3;
  --violet:#6D4CE0;
  --violet-dark:#5638C4;
  --violet-soft:#EDE8FC;
  --green:#16A776;
  --green-soft:#E2F7EE;
  --amber:#D9860F;
  --amber-soft:#FBF0DC;
  --red:#DE4B4B;
  --red-soft:#FBE7E7;
  --blue:#3E7BF0;
  --blue-soft:#E7EFFD;
  --border:#EAE7F4;
  --radius:14px;
  --radius-lg:20px;
  --shadow:0 1px 2px rgba(30,20,60,.04), 0 8px 24px rgba(30,20,60,.07);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh;}
h1,h2,h3,.brand,.big-num{font-family:'Baloo 2',sans-serif;}
a{text-decoration:none;color:inherit;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::selection{background:var(--pink);color:#fff;}

/* ---------- shell ---------- */
#app{display:flex;min-height:100vh;}
.sidebar{width:236px;flex-shrink:0;background:var(--sidebar);padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto;}
.sidebar .brandrow{display:flex;align-items:center;gap:10px;padding:4px 8px 22px;}
.sidebar .logo-badge{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--pink),var(--violet));display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;}
.sidebar .brand{font-size:19px;font-weight:700;line-height:1.1;color:#fff;}
.sidebar nav{display:flex;flex-direction:column;gap:2px;}
.sidebar .snav{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:11px;color:var(--sidebar-text);font-weight:600;font-size:14px;}
.sidebar .snav:hover{background:rgba(255,255,255,.05);}
.sidebar .snav.active{background:linear-gradient(90deg,var(--sidebar-hi),rgba(109,76,224,.25));color:#fff;box-shadow:inset 2px 0 0 var(--pink);}
.sidebar .snav .ic{width:19px;flex-shrink:0;display:flex;justify-content:center;}
.sidebar .snav .navbadge{margin-left:auto;background:var(--pink);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;}
.sidebar .foot{margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.08);}
.sidebar .logoutbtn{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:11px;color:#E39BAE;font-weight:600;font-size:14px;width:100%;background:none;border:none;text-align:left;}
.sidebar .logoutbtn:hover{background:rgba(222,75,75,.12);}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 30px;background:rgba(245,244,250,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;}
.topbar .back{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;margin-right:12px;color:var(--ink-soft);flex-shrink:0;}
.topbar .back:hover{background:var(--bg);}
.topbar-left{display:flex;align-items:center;}
.title-block h1{font-size:21px;margin:0;color:var(--ink);}
.title-block p{margin:3px 0 0;color:var(--ink-soft);font-size:13px;}
.topbar-right{display:flex;align-items:center;gap:12px;}
.bell{width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--ink-soft);position:relative;flex-shrink:0;}
.bell .dot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--pink);border:1.5px solid var(--surface);}
.avatarchip{display:flex;align-items:center;gap:9px;padding:5px 6px 5px 5px;border-radius:30px;border:1px solid var(--border);background:var(--surface);}
.avatarchip .av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--violet));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;}
.avatarchip span{font-weight:600;font-size:13px;}

.content{padding:26px 30px 60px;max-width:1180px;width:100%;margin:0 auto;}

/* ---------- cards ---------- */
.card{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:22px;border:1px solid var(--border);}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px;}
.statcard{background:var(--surface);border-radius:var(--radius-lg);border:1px solid var(--border);box-shadow:var(--shadow);padding:18px 20px;display:flex;align-items:center;gap:14px;}
.statcard .ic{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.statcard .num{font-size:24px;font-weight:800;line-height:1;}
.statcard .lbl{font-size:12.5px;color:var(--ink-soft);font-weight:600;margin-top:3px;}
.twocol{display:grid;grid-template-columns:1.55fr 1fr;gap:18px;align-items:start;}
@media(max-width:980px){.twocol{grid-template-columns:1fr;} .statgrid{grid-template-columns:repeat(2,1fr);}}

.section-title{font-size:16px;font-weight:700;margin:0 0 4px;}
.section-sub{font-size:13px;color:var(--ink-soft);margin:0 0 18px;}

/* ---------- table ---------- */
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
table th{text-align:left;color:var(--ink-soft);font-weight:700;font-size:12px;text-transform:none;padding:9px 12px;border-bottom:2px solid var(--border);white-space:nowrap;}
table td{padding:11px 12px;border-bottom:1px solid var(--border);white-space:nowrap;color:var(--ink);}
table tr:last-child td{border-bottom:none;}
.nameCell{display:flex;align-items:center;gap:10px;}
.nameCell .av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--violet-soft),var(--pink-soft));color:var(--violet-dark);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;flex-shrink:0;}
.nameCell b{font-weight:600;font-size:13.5px;}

.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:20px;font-size:11.5px;font-weight:700;}
.badge.green{background:var(--green-soft);color:var(--green);}
.badge.amber{background:var(--amber-soft);color:var(--amber);}
.badge.red{background:var(--red-soft);color:var(--red);}
.badge.blue{background:var(--blue-soft);color:var(--blue);}
.badge.grey{background:#F0EEF7;color:var(--ink-soft);}

.actions-cell{display:flex;gap:7px;}
.btn-xs{border:none;padding:7px 13px;border-radius:9px;font-weight:700;font-size:12px;white-space:nowrap;}
.btn-view{background:var(--violet-soft);color:var(--violet-dark);}
.btn-view:hover{background:#E0D8FA;}
.btn-approve{background:var(--green);color:#fff;}
.btn-approve:hover{background:#128F62;}
.btn-reject{background:var(--red-soft);color:var(--red);}
.btn-reject:hover{background:#F6D6D6;}
.btn-resolve{background:var(--violet);color:#fff;}
.btn-resolve:hover{background:var(--violet-dark);}
.btn-resume{background:var(--green);color:#fff;}
.btn-suspend{background:var(--red-soft);color:var(--red);}

.toggle{width:42px;height:24px;border-radius:20px;background:#DEDCEE;position:relative;flex-shrink:0;transition:background .15s;border:none;}
.toggle.on{background:var(--green);}
.toggle .dot{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s;}
.toggle.on .dot{left:21px;}
.togglewrap{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--ink-soft);}
.togglewrap.on{color:var(--green);}
.togglewrap.off{color:var(--red);}

.pager{display:flex;align-items:center;justify-content:space-between;margin-top:16px;font-size:13px;color:var(--ink-soft);}
.pager .pages{display:flex;gap:5px;align-items:center;}
.pager button{width:30px;height:30px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--ink-soft);font-weight:600;font-size:12.5px;}
.pager button.on{background:var(--violet);color:#fff;border-color:var(--violet);}
.pager button:disabled{opacity:.4;cursor:default;}

.searchbar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;align-items:center;}
.searchbar input[type=text]{flex:1;min-width:220px;padding:11px 14px 11px 38px;border-radius:11px;border:1.5px solid var(--border);background:var(--bg);font-size:13.5px;outline:none;}
.searchbar input[type=text]:focus{border-color:var(--violet);}
.searchwrap{position:relative;flex:1;min-width:220px;}
.searchwrap .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-faint);}
.filterbtn{display:flex;align-items:center;gap:7px;padding:11px 15px;border-radius:11px;border:1.5px solid var(--border);background:var(--surface);font-weight:600;font-size:13px;color:var(--ink-soft);}

.empty{text-align:center;padding:50px 20px;color:var(--ink-faint);}
.empty .ic{margin-bottom:10px;display:flex;align-items:center;justify-content:center;}

/* recent activity + quick actions */
.activity-row{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
.activity-row:last-child{border-bottom:none;}
.activity-row .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex-shrink:0;}
.activity-row .txt b{display:block;font-size:13.5px;font-weight:600;}
.activity-row .txt span{font-size:12px;color:var(--ink-soft);}
.activity-row .time{margin-left:auto;font-size:11.5px;color:var(--ink-faint);white-space:nowrap;}

.qa-row{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:12px;}
.qa-row:hover{background:var(--bg);}
.qa-row .ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.qa-row b{font-size:13.5px;font-weight:600;flex:1;}
.qa-row .navbadge{background:var(--pink);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;}

/* ---------- login ---------- */
.loginwrap{display:flex;min-height:100vh;width:100%;}
.login-hero{flex:1;background:radial-gradient(circle at 20% 15%,#2C2260,var(--sidebar) 60%);position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:60px;color:#fff;}
.login-hero::before{content:'';position:absolute;right:-140px;top:-100px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(236,72,153,.5),transparent 70%);}
.login-hero::after{content:'';position:absolute;left:-120px;bottom:-140px;width:380px;height:380px;border-radius:50%;background:radial-gradient(circle,rgba(109,76,224,.45),transparent 70%);}
.login-hero .in{position:relative;z-index:2;}
.login-hero .logo-badge{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,var(--pink),var(--violet));display:flex;align-items:center;justify-content:center;margin-bottom:18px;}
.login-hero h1{font-size:30px;margin:0 0 6px;}
.login-hero p.tag{color:#C7C2E8;font-size:14px;margin:0;max-width:280px;line-height:1.5;}
.login-form-wrap{flex:1;display:flex;align-items:center;justify-content:center;background:var(--surface);padding:40px;}
.login-form{width:100%;max-width:340px;}
.login-form h2{font-size:23px;margin:0 0 6px;}
.login-form p.sub{color:var(--ink-soft);font-size:13.5px;margin:0 0 26px;}
.field{margin-bottom:16px;}
.field label{display:block;font-weight:600;font-size:13px;margin-bottom:6px;color:var(--ink);}
.field-input{position:relative;}
.field-input .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink-faint);}
.field input{width:100%;padding:12px 13px 12px 38px;border-radius:11px;border:1.5px solid var(--border);background:var(--bg);font-size:14px;color:var(--ink);outline:none;}
.field input:focus{border-color:var(--violet);}
.btn-primary{width:100%;background:linear-gradient(90deg,var(--violet),var(--pink));color:#fff;border:none;padding:14px;border-radius:12px;font-weight:700;font-size:15px;}
.btn-primary:hover{opacity:.92;}
.login-err{background:var(--red-soft);color:var(--red);padding:10px 13px;border-radius:10px;font-size:12.5px;font-weight:600;margin-bottom:14px;}

/* ---------- profile ---------- */
.profile-head{display:flex;align-items:center;gap:16px;margin-bottom:18px;}
.profile-head .av{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,var(--pink),var(--violet));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px;flex-shrink:0;}
.profile-head h2{margin:0 0 3px;font-size:19px;}
.infolist{display:flex;flex-direction:column;gap:13px;}
.inforow{display:flex;align-items:center;gap:11px;font-size:13.5px;}
.inforow .ic{width:30px;height:30px;border-radius:9px;background:var(--violet-soft);color:var(--violet-dark);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.inforow b{font-weight:600;}
.statrow{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border);font-size:13.5px;}
.statrow:last-child{border-bottom:none;}
.statrow span:first-child{color:var(--ink-soft);}
.statrow span:last-child{font-weight:700;}

/* ---------- modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(20,16,40,.5);display:none;align-items:center;justify-content:center;z-index:200;padding:20px;}
.modal-bg.show{display:flex;}
.modal{background:var(--surface);border-radius:18px;padding:24px;max-width:440px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.3);border:1px solid var(--border);max-height:88vh;overflow-y:auto;}
.modal h3{margin:0 0 4px;font-size:18px;}
.modal .msub{color:var(--ink-soft);font-size:13px;margin:0 0 18px;}
.modal .mrow{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:13.5px;}
.modal .mrow:last-of-type{border-bottom:none;}
.modal .mrow span:first-child{color:var(--ink-soft);}
.modal .mrow span:last-child{font-weight:600;text-align:right;}
.modal .mfoot{display:flex;gap:10px;margin-top:18px;}
.btn-ghost{background:var(--bg);border:1.5px solid var(--border);color:var(--ink);padding:11px 16px;border-radius:11px;font-weight:600;font-size:13.5px;flex:1;}
.btn-ghost:hover{background:var(--border);}

.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--sidebar);color:#fff;padding:13px 22px;border-radius:12px;font-weight:600;font-size:13.5px;z-index:300;opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;box-shadow:0 10px 30px rgba(0,0,0,.25);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

/* mobile */
.hamburger{display:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--surface);align-items:center;justify-content:center;color:var(--ink-soft);margin-right:10px;flex-shrink:0;}
.sidebar-backdrop{display:none;}
@media(max-width:960px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:60;transform:translateX(-100%);transition:transform .2s;}
  .sidebar.open{transform:translateX(0);}
  .sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(10,8,25,.5);z-index:55;}
  .sidebar-backdrop.show{display:block;}
  .hamburger{display:flex;}
  .content{padding:20px 16px 60px;}
  .topbar{padding:14px 16px;}
  .statgrid{grid-template-columns:1fr 1fr;}
  .login-hero{display:none;}
  .avatarchip span{display:none;}
}
</style>
</head>

<div id="app"></div>
<div class="sidebar-backdrop" id="sideBg" onclick="toggleSide(false)"></div>
<div class="toast" id="toast"></div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modalBox"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
/* =========================================================
   BACKEND CONNECTION CONFIG — Supabase project SahiyaTracker
   Same project as sahiya-tracker.html. The admin account itself is
   a normal profiles row with is_admin=true — set that flag once via
   the SQL editor after the admin signs up through the tracker's
   signup form (or is created directly in Supabase Auth).
   ========================================================= */
const SUPABASE_URL = "https://ybhowfxgkmzbvbihxuwr.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InliaG93Znhna216YnZiaWh4dXdyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0NDQ5ODYsImV4cCI6MjEwNTAyMDk4Nn0.3Vq80N3JCvh71rElFq3kK5TktvJbKmE0P-6QEUvpOXE";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
</script>
<script>
/* ============ DATA LAYER ============
   DB.sahiyas / DB.approvals / DB.troubleshoot / DB.dataEdits / DB.activity
   are now loaded from the backend (MongoDB) instead of localStorage.
   `id` on every item is normalized to whatever the backend uses as its
   natural key (a Sahiya's `code`, or Mongo's `_id` for everything else)
   so the rest of this file's render/lookup code needs no other changes.
   ===================================== */

let DB = { admin: {loggedIn:false, authChecked:false, name:'Admin'}, sahiyas:[], approvals:[], troubleshoot:[], dataEdits:[], activity:[] };

function todayLabel(){ return new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtDate(d){ if(!d) return '\u2014'; const dt=new Date(d); return isNaN(dt)? d : dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function initials(name){ return (name||'?').split(' ').filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join(''); }

const ACTIVITY_TEXT = {
  signup: ['New Sahiya signed up','blue'],
  status_active: ['Sahiya approved','green'],
  status_rejected: ['Sahiya signup rejected','red'],
  status_suspended: ['Sahiya suspended','red'],
  status_pending: ['Sahiya moved to pending','amber'],
  data_edit_approved: ['Data edit approved','green'],
  data_edit_rejected: ['Data edit rejected','red'],
  troubleshoot_resolved: ['Troubleshoot ticket resolved','green'],
};

/** Pulls every list this panel shows from Supabase and normalizes each item's `id`. */
async function refreshAdminData(){
  const [profilesRes, editsRes, ticketsRes, activityRes] = await Promise.all([
    sb.from('profiles').select('*').order('created_at', {ascending:false}),
    sb.from('data_edit_requests').select('*').order('created_at', {ascending:false}),
    sb.from('troubleshoot_tickets').select('*').order('created_at', {ascending:false}),
    sb.from('activity_log').select('*').order('created_at', {ascending:false}).limit(200),
  ]);
  const firstErr = profilesRes.error || editsRes.error || ticketsRes.error || activityRes.error;
  if(firstErr) throw firstErr;
  const profiles = profilesRes.data, edits = editsRes.data, tickets = ticketsRes.data, activity = activityRes.data;

  const byId = Object.fromEntries(profiles.map(p=>[p.id,p]));

  DB.sahiyas = profiles.filter(p=>!p.is_admin && (p.status==='active'||p.status==='suspended')).map(s=>({
    id: s.code, _uid: s.id, code: s.code, name: s.name, phone: s.phone, email: s.email,
    dept: 'Unassigned', status: s.status==='active'?'Active':'Suspended', joined: (s.created_at||'').slice(0,10),
    adsOn: s.ads_on!==false, suspendedOn: s.status==='suspended' ? fmtDate(s.updated_at) : null,
    telegramUserId: s.telegram_user_id||null,
    payments: {totalStatus:0, totalRanking:0, totalLayer:'\u2014'},
  }));

  DB.approvals = profiles.filter(p=>!p.is_admin && p.status==='pending').map(a=>({
    id: a.id, _uid: a.id, name: a.name, phone: a.phone, code: a.code, email: a.email,
    telegramUserId: a.telegram_user_id||null,
    requestedOn: fmtDate(a.created_at), status: 'pending',
  }));

  DB.troubleshoot = tickets.map(t=>{
    const s = byId[t.user_id];
    return { id: t.id, sahiyaId: s?s.code:t.user_id, _uid: t.user_id, name: s?s.name:'', phone: s?s.phone:'',
      telegramUserId: s?s.telegram_user_id:null,
      query: t.subject ? (t.subject+' \u2014 '+t.message) : t.message, reportedOn: fmtDate(t.created_at), status: t.status };
  });

  DB.dataEdits = edits.map(d=>{
    const s = byId[d.user_id];
    return { id: d.id, sahiyaId: s?s.code:d.user_id, _uid: d.user_id, name: s?s.name:'', phone: s?s.phone:'',
      telegramUserId: s?s.telegram_user_id:null,
      field: d.field, newValue: d.new_value, requestedOn: fmtDate(d.created_at), status: d.status,
      action: d.action||'field_edit', recordType: d.record_type, recordId: d.record_id, payload: d.payload };
  });

  DB.activity = activity.map(a=>{

/* ============ RENDER ROOT ============ */
/** Shown until Supabase resolves whether there's a saved session, so a
 *  refresh doesn't flash the login screen for logged-in admins — the panel
 *  used to call renderLogin() immediately (loggedIn defaults to false) and
 *  then jump to the dashboard a moment later once auth caught up, which
 *  looked like it had logged the admin out. */
function renderBoot(){
  document.getElementById('app').innerHTML = `
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--sidebar);">
      <div class="logo-badge" style="width:60px;height:60px;">${I('heart',28)}</div>
    </div>`;
}
function render(){
  if(!DB.admin.authChecked){ renderBoot(); return; }
  const route = currentRoute();
  if(!DB.admin.loggedIn && route!=='login'){ ROUTE='login'; render(); return; }
  toggleSide(false);
  if(route==='login') return renderLogin();
  if(route==='dashboard') return renderDashboard();
  if(route==='sahiyas') return renderSahiyaList();
  if(route.startsWith('sahiya/')) return renderSahiyaProfile(route.split('/')[1]);
  if(route==='approvals') return renderApprovals();
  if(route==='troubleshoot') return renderTroubleshoot();
  if(route==='dataedits') return renderDataEdits();
  if(route==='suspend') return renderSuspend();
  if(route==='ads') return renderAds();
  ROUTE='dashboard'; render();
}

async function doLogin(){
  const email=document.getElementById('loginCode').value.trim();
  const pass=document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginErr');
  if(!email || !pass){ errEl.innerHTML = `<div class="login-err">Please enter your email and password.</div>`; return; }
  try{
    const {error} = await sb.auth.signInWithPassword({email, password:pass});
    if(error) throw error;
    // onAuthStateChange (below) takes it from here: it verifies admin access
    // (is_admin on the profile), populates DB, and renders the dashboard.
  } catch(e){
    let msg = 'Invalid login code or password.';
    if(/invalid.*credentials|invalid login/i.test(e.message||'')) msg = 'Invalid email or password.';
    errEl.innerHTML = `<div class="login-err">${msg}</div>`;
  }
}
function doLogout(){
  sb.auth.signOut().catch(()=>{});
  DB.admin.loggedIn=false; ROUTE='login'; render();

/* ============ PAGINATION HELPER ============ */
const PAGE_SIZE = 5;
const pageState = {};
function paginate(list, key){
  if(!(key in pageState)) pageState[key]=1;
  const totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  if(pageState[key] > totalPages) pageState[key] = totalPages;
  const start = (pageState[key]-1)*PAGE_SIZE;
  return {page:pageState[key], totalPages, slice:list.slice(start, start+PAGE_SIZE)};
}
function renderPager(key, totalPages, page, rerenderFn){
  if(totalPages<=1) return '';
  let btns='';
  for(let i=1;i<=totalPages;i++){
    if(totalPages>7 && Math.abs(i-page)>2 && i!==1 && i!==totalPages){
      if(i===2||i===totalPages-1) btns+=`<span style="padding:0 4px">…</span>`;
      continue;
    }
    btns+=`<button class="${i===page?'on':''}" onclick="pageState['${key}']=${i};${rerenderFn}()">${i}</button>`;
  }
  return `<div class="pager">
    <span>Page ${page} of ${totalPages}</span>
    <div class="pages">
      <button ${page<=1?'disabled':''} onclick="pageState['${key}']=${page-1};${rerenderFn}()">${I('chevronLeft',14)}</button>
      ${btns}
      <button ${page>=totalPages?'disabled':''} onclick="pageState['${key}']=${page+1};${rerenderFn}()">${I('chevronRight',14)}</button>
    </div>
  </div>`;
}

    </tr>`).join('') || `<tr><td colspan="6"><div class="empty">${I('check',30)}<br>No pending approval requests</div></td></tr>`;

  shell('approvals', {title:'New Sahiya Approval Requests', sub:'Apply and approve new Sahiya requests.'}, `
    <div class="card">
      <div class="table-wrap">
        <table>
          <thead><tr><th>Name</th><th>Phone Number</th><th>Code</th><th>Email</th><th>Requested</th><th>Actions</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      ${renderPager('approvals', totalPages, page, 'renderApprovals')}
    </div>
  `);
}
function viewApproval(id){
  const a=DB.approvals.find(x=>x.id===id);
  document.getElementById('modalBox').innerHTML = `
    <h3>${a.name}</h3>
    <p class="msub">Approval request details</p>
    <div class="mrow"><span>Phone</span><span>${a.phone}</span></div>
    <div class="mrow"><span>Code</span><span>${a.code}</span></div>
    <div class="mrow"><span>Email</span><span>${a.email}</span></div>
    <div class="mrow"><span>Requested On</span><span>${a.requestedOn}</span></div>
    <div class="mfoot">
      <button class="btn-ghost" onclick="closeModal()">Close</button>
      <button class="btn-xs btn-approve" style="flex:1;padding:11px" onclick="decideApproval('${a.id}',true);closeModal()">Approve</button>
    </div>`;
  document.getElementById('modalBg').classList.add('show');
}
/** Admin → Sahiya notification, sent over every channel the Sahiya has set up
 *  (Telegram chat id on file, and/or a linked OneSignal push subscription).
 *  Fire-and-forget; each channel is a no-op if the Sahiya hasn't set it up. */
function notifySahiya(sahiya, message, title){
  if(!sahiya) return;
  if(sahiya.telegramUserId){
    sb.functions.invoke('send-telegram', {body:{chatId:sahiya.telegramUserId, message}}).catch(()=>{});
  }
  const uid = sahiya._uid || sahiya.id; // _uid is the Supabase auth id; DB.sahiyas' own `id` is the Sahiya code, not this
  if(uid){
    sb.functions.invoke('send-push', {body:{userId:uid, title: title||'Sahiya Tracker', message}}).catch(()=>{});
  }
}

async function decideApproval(id, approve){
  const a = DB.approvals.find(x=>x.id===id);
  if(!a) return;
  try{
    const {error} = await sb.from('profiles').update({status: approve?'active':'rejected'}).eq('id', id);
    if(error) throw error;
    notifySahiya(a, approve
      ? 'Your Sahiya Tracker signup has been approved. You can now log in.'
      : 'Your Sahiya Tracker signup request was rejected by the admin. Please contact support.');
    await refreshAdminData();
    toast(approve? `${a.name} approved` : `${a.name} rejected`);
  }catch(e){
    toast(e.message || 'Could not decide on this request');
  }
  renderApprovals();
}

/* ============ TROUBLESHOOTING ============ */

      <td>${t.reportedOn}</td>

      </div></td>
    </tr>`).join('') || `<tr><td colspan="5"><div class="empty">${I('wrench',30)}<br>No open troubleshooting requests</div></td></tr>`;

  shell('troubleshoot', {title:'Troubleshooting Requests', sub:'Track and resolve issues raised by Sahiya.'}, `
    <div class="card">
      <div class="table-wrap">
        <table>
          <thead><tr><th>Name</th><th>Phone Number</th><th>Query</th><th>Reported On</th><th>Actions</th></tr></thead>

        </table>
      </div>
      ${renderPager('troubleshoot', totalPages, page, 'renderTroubleshoot')}

}
function viewTroubleshoot(id){
  const t=DB.troubleshoot.find(x=>x.id===id);
  document.getElementById('modalBox').innerHTML = `
    <h3>${t.name}</h3>
    <p class="msub">${t.reportedOn}</p>
    <div class="mrow"><span>Phone</span><span>${t.phone}</span></div>
    <div class="mrow"><span>Query</span><span>${t.query}</span></div>
    <div class="mfoot">
      <button class="btn-ghost" onclick="closeModal()">Close</button>
      <button class="btn-xs btn-resolve" style="flex:1;padding:11px" onclick="resolveTroubleshoot('${t.id}');closeModal()">Mark Resolved</button>
    </div>`;
  document.getElementById('modalBg').classList.add('show');
}
async function resolveTroubleshoot(id){
  const t=DB.troubleshoot.find(x=>x.id===id);
  try{
    const {error} = await sb.from('troubleshoot_tickets').update({status:'resolved'}).eq('id', id);
    if(error) throw error;

/* ============ DATA EDIT APPROVAL ============ */
function renderDataEdits(){
  const list = DB.dataEdits.filter(d=>d.status==='pending');
  const {slice, totalPages, page} = paginate(list, 'dataedits');
  const rows = slice.map(d=>`
    <tr>
      <td><div class="nameCell"><div class="av">${initials(d.name)}</div><b>${d.name}</b></div></td>
      <td>${d.phone}</td>
      <td>${d.field}</td>
      <td>${d.requestedOn}</td>
      <td><div class="actions-cell">
        <button class="btn-xs btn-view" onclick="viewDataEdit('${d.id}')">View</button>
        <button class="btn-xs btn-approve" onclick="decideDataEdit('${d.id}',true)">Approve</button>
        <button class="btn-xs btn-reject" onclick="decideDataEdit('${d.id}',false)">Reject</button>
      </div></td>
    </tr>`).join('') || `<tr><td colspan="5"><div class="empty">${I('pencil',30)}<br>No pending edit requests</div></td></tr>`;

  shell('dataedits', {title:'Data Edit Approval', sub:'Review and approve edit requests from Sahiya.'}, `
    <div class="card">
      <div class="table-wrap">
        <table>
          <thead><tr><th>Name</th><th>Phone Number</th><th>Field</th><th>Requested On</th><th>Actions</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      ${renderPager('dataedits', totalPages, page, 'renderDataEdits')}
    </div>
  `);
}
function viewDataEdit(id){
  const d=DB.dataEdits.find(x=>x.id===id);
  const isRecord = d.action!=='field_edit';
  const isDelete = d.action==='record_delete';
  const payloadRows = d.payload ? Object.entries(d.payload).map(([k,v])=>{
    const shown = Array.isArray(v) ? (v.length+' item(s)') : (v==null||v==='' ? '\u2014' : String(v));
    return `<div class="mrow"><span>${k}</span><span>${shown}</span></div>`;
  }).join('') : '';
  document.getElementById('modalBox').innerHTML = `
    <h3>${d.name}</h3>
    <p class="msub">${isDelete ? 'Requesting deletion of' : 'Requesting a change to'}: ${d.field}</p>
    <div class="mrow"><span>Phone</span><span>${d.phone}</span></div>
    ${!isRecord ? `<div class="mrow"><span>Field</span><span>${d.field}</span></div>` : ''}
    ${!isRecord && d.newValue ? `<div class="mrow"><span>Requested Value</span><span>${d.newValue}</span></div>` : ''}
    ${isRecord && !isDelete ? `<div class="mrow"><span>Proposed changes</span><span></span></div>${payloadRows}` : ''}
    <div class="mrow"><span>Requested On</span><span>${d.requestedOn}</span></div>
    <div class="mfoot">
      <button class="btn-ghost" onclick="closeModal()">Close</button>
      <button class="btn-xs ${isDelete?'btn-reject':'btn-approve'}" style="flex:1;padding:11px" onclick="decideDataEdit('${d.id}',true);closeModal()">${isDelete?'Approve Delete':'Approve'}</button>
    </div>`;
  document.getElementById('modalBg').classList.add('show');
}
async function decideDataEdit(id, approve){
  const d=DB.dataEdits.find(x=>x.id===id);
  const verb = d.action==='record_delete' ? 'delete' : 'update';
  try{
    const {error} = await sb.from('data_edit_requests').update({status: approve?'approved':'rejected'}).eq('id', id);
    if(error) throw error;
    notifySahiya(d, approve
      ? `Your request to ${verb} ${d.field} has been approved.`
      : `Your request to ${verb} ${d.field} was rejected by the admin.`);
    await refreshAdminData();
    toast(approve? `${d.field} ${verb} approved for ${d.name}` : `Rejected request for ${d.name}`);
  }catch(e){
    toast(e.message || 'Could not decide on this request');
  }
  renderDataEdits();
}

/* ============ SUSPEND SAHIYA ============ */
function renderSuspend(){
  const {slice, totalPages, page} = paginate(DB.sahiyas, 'suspend');
  const rows = slice.map(s=>`
    <tr>
      <td><div class="nameCell"><div class="av">${initials(s.name)}</div><b>${s.name}</b></div></td>
      <td>${s.phone}</td>
      <td>${s.dept}</td>
      <td><span class="badge ${s.status==='Active'?'green':'red'}">${s.status}</span></td>
      <td>${s.status==='Suspended' ? (s.suspendedOn||'—') : '—'}</td>
      <td>
        ${s.status==='Active'
          ? `<button class="btn-xs btn-suspend" onclick="suspendSahiya('${s.id}')">Suspend</button>`
          : `<button class="btn-xs btn-resume" onclick="resumeSahiya('${s.id}')">Resume</button>`}
      </td>
    </tr>`).join('') || `<tr><td colspan="6"><div class="empty">No Sahiya records</div></td></tr>`;

  shell('suspend', {title:'Suspend Sahiya', sub:'Temporarily detach or restore a Sahiya account.'}, `
    <div class="card">
      <div class="table-wrap">
        <table>
          <thead><tr><th>Name</th><th>Phone Number</th><th>Department</th><th>Status</th><th>Suspended On</th><th>Action</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      ${renderPager('suspend', totalPages, page, 'renderSuspend')}
    </div>
  `);
}
async function suspendSahiya(id){
  const s=DB.sahiyas.find(x=>x.id===id);
  try{
    const {error} = await sb.from('profiles').update({status:'suspended'}).eq('code', id);
    if(error) throw error;
    notifySahiya(s, 'Your Sahiya Tracker account has been suspended by the admin. Please contact support.');
    await refreshAdminData();
    toast(`${s.name} suspended`);
  }catch(e){
    toast(e.message || 'Could not suspend this Sahiya');
  }
  renderSuspend();
}
async function resumeSahiya(id){
  const s=DB.sahiyas.find(x=>x.id===id);
  try{
    const {error} = await sb.from('profiles').update({status:'active'}).eq('code', id);
    if(error) throw error;
    notifySahiya(s, 'Your Sahiya Tracker account has been resumed by the admin. You can log in again.');
    await refreshAdminData();
    toast(`${s.name} resumed`);
  }catch(e){
    toast(e.message || 'Could not resume this Sahiya');
  }
  renderSuspend();
}

/* ============ ADS MANAGEMENT ============ */
function renderAds(){
  const onCount = DB.sahiyas.filter(s=>s.adsOn!==false).length;
  const {slice, totalPages, page} = paginate(DB.sahiyas, 'ads');
  const rows = slice.map(s=>`
    <tr>
      <td><div class="nameCell"><div class="av">${initials(s.name)}</div><b>${s.name}</b></div></td>
      <td>${s.phone}</td>
      <td>${s.code}</td>
      <td><span class="togglewrap ${s.adsOn!==false?'on':'off'}">${s.adsOn!==false?'On':'Off'}</span></td>
      <td>
        <button class="toggle ${s.adsOn!==false?'on':''}" onclick="toggleAd('${s.id}')"><span class="dot"></span></button>
      </td>
    </tr>`).join('') || `<tr><td colspan="5"><div class="empty">No Sahiya records</div></td></tr>`;

  shell('ads', {title:'Ads Management', sub:`Turn off ads for specific Sahiya (${onCount} enabled)`}, `
    <div class="card">
      <div class="table-wrap">
        <table>
          <thead><tr><th>Name</th><th>Phone Number</th><th>Code</th><th>Ad Status</th><th>Actions</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      ${renderPager('ads', totalPages, page, 'renderAds')}
    </div>
  `);
}
async function toggleAd(id){
  const s=DB.sahiyas.find(x=>x.id===id);
  const next = !(s.adsOn!==false);
  try{
    const {error} = await sb.from('profiles').update({ads_on: next}).eq('code', id);
    if(error) throw error;
    await refreshAdminData();
    toast(`Ads turned ${next?'on':'off'} for ${s.name}`);
  }catch(e){
    toast(e.message || 'Could not update ad setting');
  }
  renderAds();
}

/* ============ BACKGROUND POLLING ============
   Pending items (a new data-edit/delete request, a new signup, a new
   troubleshoot ticket) used to only appear after the admin happened to
   click something that called refreshAdminData(). Poll in the background
   so they show up on their own, without disturbing anything the admin is
   in the middle of (typing, or a modal open). */
let _adminPollInterval = null;
function startAdminPolling(){
  if(_adminPollInterval) clearInterval(_adminPollInterval);
  _adminPollInterval = setInterval(async ()=>{
    if(!DB.admin.loggedIn) return;
    try{
      await refreshAdminData();
      const modalOpen = document.getElementById('modalBg').classList.contains('show');
      if(!modalOpen) render();
    }catch(e){ console.warn('Admin poll failed:', e.message); }
  }, 20000);
}

/* init */
render();
sb.auth.onAuthStateChange(async function(event, session){
  DB.admin.authChecked = true;
  const user = session && session.user;
  if(user){
    try{
      const {data:profile, error} = await sb.from('profiles').select('*').eq('id', user.id).single();
      if(error) throw error;
      if(!profile.is_admin){
        sb.auth.signOut();
        DB.admin.loggedIn = false;
        const errEl = document.getElementById('loginErr');
        if(errEl) errEl.innerHTML = `<div class="login-err">This account does not have admin access.</div>`;
        ROUTE = 'login';
        render();
        return;
      }
      await refreshAdminData();
      DB.admin.loggedIn = true;
      DB.admin.name = profile.name || user.email || 'Admin';
      ROUTE = 'dashboard';
      startAdminPolling();
    }catch(e){
      DB.admin.loggedIn = false;
      ROUTE = 'login';
    }
  } else {
    DB.admin.loggedIn = false;
    ROUTE = 'login';
    if(_adminPollInterval){ clearInterval(_adminPollInterval); _adminPollInterval = null; }
  }
  render();
});
</script>
